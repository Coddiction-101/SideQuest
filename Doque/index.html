<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doque | Open Documents Instantly</title>

    <link rel="stylesheet" href="style.css">

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Raleway:wght@100..900&display=swap" rel="stylesheet">

     <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="container">

            <nav class="navbar">

                <a href="/" class="logo">Doque</a>


                <ul class="nav-links">

                    <li>
                        <a href="#">
                            GitHub
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            About
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>


 
        <section class="hero">

            <div class="container">

                <div class="hero-content">


                    <h1>
                        Open Documents Instantly
                    </h1>


                    <p>
                        Paste a public PDF link and preview it directly in your browser without downloading it first.
                    </p>



                    <div class="input-group">


                        <label for="pdf-url" class="sr-only">
                            PDF URL
                        </label>


                        <input 
                            id="pdf-url"
                            type="url"
                            placeholder="https://example.com/document.pdf"
                        >


                        <button 
                            id="open-btn"
                            class="open-btn"
                        >
                            Open Document
                        </button>


                    </div>



                    <div class="features">

                        <span>
                            Public PDF Links
                        </span>

                        <span>
                            Fast Preview
                        </span>

                        <span>
                            Free to Use
                        </span>

                    </div>


                </div>

            </div>

        </section>




 
        <section class="viewer container">


            <div class="viewer-toolbar">


                <div class="toolbar-left">


                    <button id="prev-page">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>


                    <span id="page-info">
                        Page 1 / 1
                    </span>


                    <button id="next-page">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>


                </div>




                <div class="toolbar-right">


                    <button id="zoom-out">
                        <i class="fa-solid fa-minus"></i>
                    </button>


                    <button id="zoom-in">
                        <i class="fa-solid fa-plus"></i>
                    </button>


                    <button id="fullscreen-btn">
                        <i class="fa-solid fa-expand"></i>
                    </button>


                    <button id="download-btn">
                        <i class="fa-solid fa-download"></i>
                    </button>


                </div>


            </div>




            <div class="viewer-content">


                <canvas id="pdf-canvas"></canvas>



                <div class="empty-state">


                    <i class="fa-regular fa-file-pdf"></i>


                    <h2>
                        Document Viewer
                    </h2>


                    <p>
                        Paste a PDF link above to start previewing your document.
                    </p>


                </div>


            </div>


        </section>


    </main>


    <script type="module" src="script.js"></script>

</body>

</html>
